# Filtr fail2ban na přihlášení do brány (nasadí ho gateway/install.sh do
# /etc/fail2ban/filter.d/claude-hub-brana.conf).
#
# Brána si sama zamyká účet po třech pokusech (config.LOGIN_TRIES), ale to je
# zámek v databázi — útočník může dál bušit na server. Tohle ho odstřihne na
# firewallu.
#
# Čte se ze žurnálu (backend systemd), proto bez data a jména hostitele:
# journalmatch v jailu omezí čtení na jednotku brány.
[Definition]

# „neúspěšné přihlášení z 1.2.3.4" — každý špatný pokus (od 2.20.0)
# „přihlášení zablokováno na 60 min: ip:1.2.3.4|email:…" — až zámek (starší verze)
failregex = ^neúspěšné přihlášení z <HOST>\s*$
            ^přihlášení zablokováno na \d+ min:.*\bip:<HOST>\b

ignoreregex =

# Adresa chodí z nginx v X-Real-IP; brána sama poslouchá jen na loopbacku,
# takže ji zvenčí nikdo nepodvrhne.
datepattern = {^LN-BEG}
